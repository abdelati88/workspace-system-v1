{% extends 'layout.html' %}
{% block title %}تعديل سعر الأوضة{% endblock %}

{% block content %}
    <h1 class="page-title">تعديل سعر: {{ room.name }}</h1>

    <div class="panel" style="max-width: 480px;">
        <form action="{{ url_for('edit_room', room_id=room.room_id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="name">اسم الأوضة:</label>
                <!-- (الاسم للقراءة فقط) -->
                <input type="text" id="name" name="name" required value="{{ room.name }}" readonly>
            </div>

            <div class="form-group">
                <label for="hourly_rate">سعر الساعة الجديد (جنيه):</label>
                <input type="number" id="hourly_rate" name="hourly_rate" required value="{{ room.hourly_rate }}" step="0.1" min="0">
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <button type="submit" class="btn btn-success btn-lg">حفظ السعر الجديد</button>
                <a href="javascript:history.back()" class="btn-back">إلغاء</a>
            </div>
        </form>
    </div>

{% endblock %}
