{% extends 'layout.html' %}
{% block title %}إنشاء كوبون للطالب{% endblock %}

{% block content %}
    <h1>إنشاء كوبون للطالب: {{ student.name }}</h1>
    <p>هنا يمكنك إنشاء كود خصم خاص لهذا الطالب.</p>
    <hr>
    
    <form action="{{ url_for('generate_coupon', student_id=student.student_id) }}" method="POST">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="code" style="font-weight: bold;">كود الخصم (Coupon Code):</label>
            <input type="text" id="code" name="code" required 
                   value="{{ suggested_code }}"
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="discount_type" style="font-weight: bold;">نوع الخصم:</label>
            <select id="discount_type" name="discount_type" required style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
                <option value="percentage">نسبة مئوية (%)</option>
                <option value="fixed">مبلغ ثابت (جنيه)</option>
            </select>
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="discount_value" style="font-weight: bold;">قيمة الخصم:</label>
            <input type="number" id="discount_value" name="discount_value" required 
                   placeholder="مثال: 100 (يعني 100%) أو 50 (يعني 50 جنيه)"
                   step="0.1" min="0"
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>

        <!-- (جديد) خانة تاريخ الانتهاء -->
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="expiry_date" style="font-weight: bold;">تاريخ انتهاء الصلاحية (اختياري):</label>
                <input type="date" id="expiry_date" name="expiry_date" 
                       style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
            </div>
        
        <button type="submit" style="font-size: 18px; padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            إنشاء وحفظ الكوبون
        </button>
        
        <a href="javascript:history.back()" class="btn-back">
            &larr; إلغاء (رجوع)
        </a>
        
    </form>
    
{% endblock %}
