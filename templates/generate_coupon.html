{% extends 'layout.html' %}
{% block title %}إنشاء كوبون للطالب{% endblock %}

{% block content %}
    <h1 class="page-title">إنشاء كوبون للطالب: {{ student.name }}</h1>
    <p class="page-subtitle">هنا يمكنك إنشاء كود خصم خاص لهذا الطالب.</p>

    <div class="panel" style="max-width: 560px;">
        <form action="{{ url_for('generate_coupon', student_id=student.student_id) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="code">كود الخصم (Coupon Code):</label>
                <input type="text" id="code" name="code" required
                       value="{{ suggested_code }}">
            </div>

            <div class="form-group">
                <label for="discount_type">نوع الخصم:</label>
                <select id="discount_type" name="discount_type" required>
                    <option value="percentage">نسبة مئوية (%)</option>
                    <option value="fixed">مبلغ ثابت (جنيه)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="discount_value">قيمة الخصم:</label>
                <input type="number" id="discount_value" name="discount_value" required
                       placeholder="مثال: 100 (يعني 100%) أو 50 (يعني 50 جنيه)"
                       step="0.1" min="0">
            </div>

            <!-- (جديد) خانة تاريخ الانتهاء -->
            <div class="form-group">
                <label for="expiry_date">تاريخ انتهاء الصلاحية (اختياري):</label>
                <input type="date" id="expiry_date" name="expiry_date">
            </div>

            <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
                <button type="submit" class="btn btn-success btn-lg">إنشاء وحفظ الكوبون</button>

                <a href="javascript:history.back()" class="btn-back" style="margin-top:0;">
                    إلغاء (رجوع)
                </a>
            </div>

        </form>
    </div>

{% endblock %}
