{% extends 'layout.html' %}
{% block title %}تعديل بيانات الطالب{% endblock %}

{% block content %}
    <!-- 
    -->
    <h1>تعديل بيانات: {{ student.name }}</h1>
    <hr>
    
    <form action="{{ url_for('edit_student', student_id=student.student_id) }}" method="POST">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="name" style="font-weight: bold;">اسم الطالب:</label>
            <!-- 
            -->
            <input type="text" id="name" name="name" required 
                   value="{{ student.name }}"
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="phone" style="font-weight: bold;">رقم التليفون:</label>
            <input type="text" id="phone" name="phone" required 
                   value="{{ student.phone }}"
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="college" style="font-weight: bold;">الكلية (اختياري):</label>
            <input type="text" id="college" name="college" 
                   value="{{ student.college or '' }}"
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>
        

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="year" style="font-weight: bold;">الفرقة الدراسية:</label>
            <input type="text" id="year" name="year" 
                   value="{{ student.year or '' }}"
                   placeholder="مثال: الرابعة"
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>
        <button type="submit" style="font-size: 18px; padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            حفظ التعديلات
        </button>
        
        <a href="javascript:history.back()" class="btn-back">
            &larr; إلغاء (رجوع)
        </a>
        
    </form>
    
{% endblock %}
