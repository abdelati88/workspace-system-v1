{% extends 'layout.html' %}
{% block title %}تعديل بيانات الطالب{% endblock %}

{% block content %}
<h1 class="page-title">تعديل بيانات: {{ student.name }}</h1>

<div class="panel" style="max-width: 560px; margin: 0 auto;">
    <form action="{{ url_for('edit_student', student_id=student.student_id) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="name">اسم الطالب:</label>
            <input type="text" id="name" name="name" required value="{{ student.name }}">
        </div>

        <div class="form-group">
            <label for="phone">رقم التليفون:</label>
            <input type="text" id="phone" name="phone" required value="{{ student.phone }}">
        </div>

        <div class="form-group">
            <label for="college">الكلية (اختياري):</label>
            <input type="text" id="college" name="college" value="{{ student.college or '' }}">
        </div>

        <div class="form-group">
            <label for="year">الفرقة الدراسية:</label>
            <input type="text" id="year" name="year" value="{{ student.year or '' }}" placeholder="مثال: الرابعة">
        </div>

        <button type="submit" class="btn btn-success btn-lg btn-block">حفظ التعديلات</button>

        <a href="javascript:history.back()" class="btn-back" style="display:block; text-align:center;">إلغاء</a>
    </form>
</div>
{% endblock %}
