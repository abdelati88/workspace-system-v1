{% extends 'layout.html' %}
{% block title %}تعديل المنتج{% endblock %}

{% block content %}
    <h1 class="page-title">تعديل منتج: {{ product.name }}</h1>

    <div class="panel" style="max-width: 560px;">
        <form action="{{ url_for('edit_product', product_id=product.product_id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" name="name" value="{{ product.name }}" required>
            </div>

            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;">
                    <label>سعر الشراء (التكلفة):</label>
                    <input type="number" name="purchase_price" value="{{ product.purchase_price }}" step="0.1" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>سعر البيع:</label>
                    <input type="number" name="sale_price" value="{{ product.sale_price }}" step="0.1" required>
                </div>
            </div>

            <div class="form-group">
                <label>تحديث الكمية (المخزون الحالي: {{ product.stock_quantity }}):</label>
                <small style="color: var(--muted); display:block; margin-bottom:6px;">اكتب الرقم الجديد للكمية المتاحة حالياً في الدرج/التلاجة.</small>
                <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" step="0.1" required>
            </div>

            <div style="display:flex; gap:10px; align-items:center; margin-top: 8px;">
                <button type="submit" class="btn btn-success btn-lg">حفظ التعديلات</button>
                <a href="{{ url_for('manage_products') }}" class="btn-back">إلغاء</a>
            </div>
        </form>
    </div>
{% endblock %}
