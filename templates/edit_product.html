{% extends 'layout.html' %}
{% block title %}تعديل المنتج{% endblock %}

{% block content %}
    <h1>تعديل منتج: {{ product.name }}</h1>
    <hr>
    
    <form action="{{ url_for('edit_product', product_id=product.product_id) }}" method="POST">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label>اسم المنتج:</label>
            <input type="text" name="name" value="{{ product.name }}" required 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label>سعر الشراء (التكلفة):</label>
                <input type="number" name="purchase_price" value="{{ product.purchase_price }}" step="0.1" required 
                       style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div style="flex: 1;">
                <label>سعر البيع:</label>
                <input type="number" name="sale_price" value="{{ product.sale_price }}" step="0.1" required 
                       style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label>تحديث الكمية (المخزون الحالي: {{ product.stock_quantity }}):</label>
            <br>
            <small style="color: #666;">اكتب الرقم الجديد للكمية المتاحة حالياً في الدرج/التلاجة.</small>
            <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" step="0.1" required 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px;">
        </div>
        
        <button type="submit" style="margin-top: 20px; font-size: 18px; padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            حفظ التعديلات
        </button>
        
        <a href="{{ url_for('manage_products') }}" class="btn-back">
            &larr; إلغاء
        </a>
        
    </form>
{% endblock %}
