{% extends 'layout.html' %}
{% block title %}تعديل باقة {{ pkg.name }}{% endblock %}

{% block content %}
    <h1 class="page-title">تعديل باقة: {{ pkg.name }}</h1>

    <div class="panel" style="max-width: 560px; margin: 0 auto;">
        <form action="{{ url_for('edit_subscription_type', type_id=pkg.type_id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>اسم الباقة:</label>
                <input type="text" name="name" value="{{ pkg.name }}" required>
            </div>

            <div style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;">
                    <label>عدد الساعات الكلي:</label>
                    <input type="number" name="total_hours" value="{{ pkg.total_hours }}" step="0.1" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>الصلاحية (باليوم):</label>
                    <input type="number" name="days_valid" value="{{ pkg.days_valid }}" required>
                </div>
            </div>

            <div class="form-group">
                <label style="font-size: 1.05em; color: var(--gold);">السعر الجديد (جنيه):</label>
                <input type="number" name="price" value="{{ pkg.price }}" step="0.1" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg btn-block">حفظ التعديلات</button>

            <a href="{{ url_for('manage_subscription_types') }}" class="btn-back" style="display:block; text-align:center;">إلغاء</a>
        </form>
    </div>
{% endblock %}
