{% extends 'layout.html' %}
{% block title %}تعديل باقة {{ pkg.name }}{% endblock %}

{% block content %}
    <h1>تعديل باقة: {{ pkg.name }}</h1>
    <hr>
    
    <form action="{{ url_for('edit_subscription_type', type_id=pkg.type_id) }}" method="POST">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label>اسم الباقة:</label>
            <input type="text" name="name" value="{{ pkg.name }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label>عدد الساعات الكلي:</label>
                <input type="number" name="total_hours" value="{{ pkg.total_hours }}" step="0.1" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div style="flex: 1;">
                <label>الصلاحية (باليوم):</label>
                <input type="number" name="days_valid" value="{{ pkg.days_valid }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label style="font-size: 1.2em; font-weight: bold; color: #007bff;">السعر الجديد (جنيه):</label>
            <input type="number" name="price" value="{{ pkg.price }}" step="0.1" required style="width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 5px; margin-top: 5px;">
        </div>
        
        <button type="submit" style="margin-top: 20px; font-size: 18px; padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            حفظ التعديلات
        </button>
        
        <a href="{{ url_for('manage_subscription_types') }}" class="btn-back">
            &larr; إلغاء
        </a>
        
    </form>
{% endblock %}
