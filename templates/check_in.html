{% extends 'layout.html' %}
{% block title %}تسجيل دخول طالب{% endblock %}

{% block content %}
<h1 class="page-title">تسجيل دخول طالب</h1>

<div class="panel" style="max-width: 560px; margin: 0 auto;">
    <form action="{{ url_for('check_in') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="search_query">ابحث بالاسم أو رقم التليفون</label>
            <input type="text" id="search_query" name="search_query" required placeholder="اكتب اسم الطالب هنا..." autofocus>
        </div>

        <div class="panel" style="background: var(--warning-soft); border-color: rgba(179,106,30,0.3); margin-bottom:18px;">
            <div class="form-group">
                <label for="manual_date" style="color: var(--warning);">تاريخ الدخول اليدوي (اختياري)</label>
                <input type="date" id="manual_date" name="manual_date">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label for="manual_time" style="color: var(--warning);">وقت الدخول (اختياري)</label>
                <input type="time" id="manual_time" name="manual_time">
            </div>
            <p style="font-size: 0.82em; color: var(--warning); margin:0;">
                لو الجهاز كان مقفول، حدد وقت دخول الطالب الفعلي. سيبها فاضية للوقت الحالي.
            </p>
        </div>

        <button type="submit" class="btn btn-success btn-lg btn-block">تسجيل دخول</button>

        <a href="javascript:history.back()" class="btn-back" style="display:block; text-align:center;">رجوع للصفحة السابقة</a>
    </form>
</div>
{% endblock %}
