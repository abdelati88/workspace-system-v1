{% extends 'layout.html' %}
{% block title %}اختيار الأوضة{% endblock %}

{% block content %}
    <h1 class="page-title">تسجيل دخول الطالب: {{ student.name }}</h1>
    <p class="page-subtitle">تليفون: {{ student.phone }}</p>

    <div class="panel" style="max-width: 560px; margin: 0 auto;">
        <form action="{{ url_for('perform_check_in') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="student_id" value="{{ student.student_id }}">
        <input type="hidden" name="manual_time" value="{{ manual_time }}">
        <input type="hidden" name="manual_date" value="{{ manual_date }}">

            <div class="form-group">
                <label for="room_id">الرجاء اختيار الأوضة:</label>

                <select name="room_id" id="room_id" required>

                    <option value="">-- اختر الأوضة --</option>

                    {% for room in rooms %}
                        <option value="{{ room.room_id }}">
                            {{ room.name }} (الساعة بـ {{ room.hourly_rate }} جنيه)
                        </option>
                    {% endfor %}

                </select>
            </div>

            <button type="submit" class="btn btn-success btn-lg btn-block">تأكيد تسجيل الدخول (Check-in)</button>

            <a href="{{ url_for('check_in') }}" class="btn-back" style="display: block; text-align: center;">إلغاء (العودة للبحث)</a>

        </form>
    </div>

{% endblock %}
