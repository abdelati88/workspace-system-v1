{% extends 'layout.html' %}
{% block title %}اختيار الأوضة{% endblock %}

{% block content %}
    <h1>تسجيل دخول الطالب: {{ student.name }}</h1>
    <p>تليفون: {{ student.phone }}</p>
    <hr>

    <form action="{{ url_for('perform_check_in') }}" method="POST">
    <input type="hidden" name="student_id" value="{{ student.student_id }}">
    <input type="hidden" name="manual_time" value="{{ manual_time }}">
    <input type="hidden" name="manual_date" value="{{ manual_date }}">
    
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="room_id" style="font-weight: bold; font-size: 18px;">الرجاء اختيار الأوضة:</label>

            <select name="room_id" id="room_id" required 
                    style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px;">

                <option value="">-- اختر الأوضة --</option>

                {% for room in rooms %}
                    <option value="{{ room.room_id }}">
                        {{ room.name }} (الساعة بـ {{ room.hourly_rate }} جنيه)
                    </option>
                {% endfor %}

            </select>
        </div>

        <button type="submit" style="font-size: 18px; padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            تأكيد تسجيل الدخول (Check-in)
        </button>

        <a href="{{ url_for('check_in') }}" style="margin-right: 15px; text-decoration: none; color: #6c757d;">
            إلغاء (العودة للبحث)
        </a>

    </form>

{% endblock %}
