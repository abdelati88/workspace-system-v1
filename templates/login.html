<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | تاسك</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #16233D;
            --gold: #B98A2A;
            --gold-light: #E4D2A6;
            --paper: #F1E7D2;
            --surface: #FBF8F2;
            --line: #DDD2B8;
            --muted: #7A7059;
            --danger: #A23B32;
            --danger-soft: #F2DCD8;
            --success: #2F6F4E;
            --success-soft: #DEEAE1;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
            background: var(--ink);
            background-image: radial-gradient(circle at 15% 20%, rgba(185,138,42,0.16), transparent 45%),
                               radial-gradient(circle at 85% 85%, rgba(43,95,160,0.18), transparent 45%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            background: var(--surface);
            width: 380px;
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .login-brand {
            text-align: center;
            padding: 34px 30px 20px;
        }
        .login-brand img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .login-brand h1 {
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 1.6em;
            color: var(--ink);
            margin: 0 0 4px;
        }
        .login-brand p {
            margin: 0;
            color: var(--muted);
            font-size: 0.88em;
        }
        .login-body { padding: 6px 30px 30px; }
        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.88em;
            color: var(--ink);
        }
        .form-group input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            font-family: inherit;
            color: var(--ink);
        }
        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(185, 138, 42, 0.22);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background-color: var(--ink);
            color: var(--surface);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            transition: background-color 0.15s ease;
        }
        .btn:hover { background-color: #223458; }

        .flash-message {
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            text-align: right;
            border-right: 4px solid transparent;
        }
        .flash-message.error {
            background-color: var(--danger-soft);
            color: var(--danger);
            border-right-color: var(--danger);
        }
        .flash-message.success {
            background-color: var(--success-soft);
            color: var(--success);
            border-right-color: var(--success);
        }

        .shutdown-row {
            text-align: center;
            padding: 14px 30px 26px;
            border-top: 1px solid var(--line);
        }
        .shutdown-row button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            padding: 6px 10px;
        }
        .shutdown-row button:hover { color: var(--danger); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="تاسك">
            <h1>تسجيل الدخول</h1>
            <p>مساحة تاسك للمذاكرة والعمل</p>
        </div>

        <div class="login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">دخول</button>
            </form>
        </div>

        <div class="shutdown-row">
            <form action="{{ url_for('shutdown') }}" method="POST"
                  onsubmit="return confirm('⚠️ هل أنت متأكد أنك تريد إغلاق البرنامج تماماً؟');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">إغلاق النظام نهائياً</button>
            </form>
        </div>
    </div>
</body>
</html>
