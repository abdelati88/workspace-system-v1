{% extends 'layout.html' %}
{% block title %}نقل الطالب{% endblock %}

{% block content %}
    <h1 class="page-title">🔄 نقل الطالب لمكان آخر</h1>

    <div class="panel" style="max-width: 520px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 18px;">
            <h3 style="color: var(--blue); margin-bottom: 8px;">{{ student_name }}</h3>
            <span class="badge badge-info">المكان الحالي: {{ current_room }}</span>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>📍 اختر المكان الجديد:</label>
                <select name="new_room">
                    {% for room in all_rooms %}
                        <option value="{{ room['name'] }}" {% if room['name'] == current_room %}selected{% endif %}>
                            {{ room['name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <p style="background: var(--warning-soft); color: var(--warning); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85em; margin: 14px 0;">
                تنبيه: سيتم نقل الطالب وتحديث الغرفة في الفاتورة الحالية.
            </p>

            <button type="submit" class="btn btn-accent btn-lg btn-block">تأكيد النقل ✅</button>

            <a href="{{ url_for('dashboard') }}" class="btn-back" style="display: block; text-align: center; margin-top: 10px;">إلغاء وعودة ❌</a>
        </form>
    </div>
{% endblock %}
