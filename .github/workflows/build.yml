name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run system and regression tests
      run: |
        python tests/test_system.py
        if ($LASTEXITCODE -ne 0) { throw 'System tests failed' }
        python -m unittest discover -s tests -p "test_regressions.py" -v
        if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }

    - name: Build TaskWorkspace.exe
      run: pyinstaller --noconfirm --onefile --noconsole --name TaskWorkspace --add-data "templates;templates" --add-data "Static;static" app.py

    - name: Smoke test (start the exe and hit it)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $exe = Join-Path $PWD 'dist\TaskWorkspace.exe'
        Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden

        $up = $false
        for ($i = 0; $i -lt 120 -and -not $up; $i++) {
          Start-Sleep -Seconds 1
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5009/login' -UseBasicParsing
            $up = ($r.StatusCode -eq 200)
          } catch { }
        }
        if (-not $up) { throw 'The exe never served /login within 120 seconds' }

        $logo = Invoke-WebRequest -Uri 'http://127.0.0.1:5009/static/logo.png' -UseBasicParsing
        if ($logo.StatusCode -ne 200) { throw 'Static files were not bundled correctly' }

        foreach ($f in 'workspace.db', 'initial_admin_password.txt') {
          if (-not (Test-Path (Join-Path 'dist' $f))) { throw "First run did not create $f" }
        }

        # Full work cycle against the real exe: shift, student, check-in, sale, payment, close - and verify the totals
        python tests/smoke_exe.py dist
        if ($LASTEXITCODE -ne 0) { throw 'Full EXE smoke test failed' }

        # No console window: output goes to workspace.log next to the exe
        if (-not (Test-Path 'dist\workspace.log')) { throw 'workspace.log was not created' }

        # Launching the exe again while it runs must not start a second server or kill the first one
        $second = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
        if (-not $second.WaitForExit(30000)) { throw 'Second launch did not exit' }
        $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5009/login' -UseBasicParsing
        if ($r.StatusCode -ne 200) { throw 'Server stopped after a second launch' }
        if ((Get-Process TaskWorkspace -ErrorAction SilentlyContinue | Measure-Object).Count -lt 1) { throw 'Server process is gone' }

        Get-Process TaskWorkspace -ErrorAction SilentlyContinue | Stop-Process -Force
        Write-Host 'Smoke test passed'

    - name: Upload TaskWorkspace.exe
      uses: actions/upload-artifact@v4
      with:
        name: TaskWorkspace-Windows
        path: dist/TaskWorkspace.exe
        if-no-files-found: error
